name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project in a git repository
        2. Click + new workspace
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Outer terminal
      description: The terminal cornercase runs in, and tmux or ssh if they are in between.
      placeholder: Ghostty 1.2 over ssh
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: server.log
      description: The relevant lines of `$XDG_RUNTIME_DIR/cornercase/server.log`, if any. Check that they contain no tokens or private paths.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the program running in the pane, your config.json without secrets…
